providers = ["...", "node", "php"]

[phases.setup]
nixPkgs = ["...", "php82", "php82Packages.composer", "php82Extensions.pdo_mysql", "nodejs_22"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --prefer-dist",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan storage:link && php artisan migrate --force && php artisan db:seed --class=UserSeeder --force && php artisan serve --host=0.0.0.0 --port=$PORT"
